name: Publish a release

# Tag a release to publish it: run dev/scripts/bump-version.sh, write the CHANGELOG
# entry, commit, then `git tag v1.1.0 && git push origin v1.1.0`. The steps are in
# dev/RELEASING.md.
#
# The test suite is not run here. It runs on your machine, in every environment, before
# you tag (dev/RELEASING.md). Running it here again would repeat that, and let a mirror
# or registry hiccup stop a release that was fine.
#
# Pushing to a branch does nothing here. On a tag, in order:
#
#   1. The CHANGELOG must describe the version. Checked first, because it is the
#      cheapest thing to get wrong.
#   2. The tag must still name the commit this run built.
#   3. The release is published with:
#
#        Resume.pdf, CoverLetter.pdf    the examples as committed at the tag, which are
#                                       the ones looked at before tagging
#        Resume-ATS-Friendly-<version>.zip
#                                       the template. What goes in is decided by
#                                       export-ignore in .gitattributes.
#        SHA256SUMS                     so a download can be checked
#
# The zip is built with `git archive`, so it holds what is committed at the tag and
# nothing the runner's working directory happens to contain.
#
# The release body is this version's CHANGELOG.md section followed by
# dev/release-notes-tail.md.
#
# workflow_dispatch runs everything as a rehearsal and publishes nothing, whichever
# branch or tag it is started on, so a run before the tag exists proves the release
# would work. Only a pushed tag publishes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only to attach files to a release. Nothing here can write to a branch.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail

          # On a tag the tag decides, whether it was pushed or a rehearsal was started on
          # it. A rehearsal on a branch has no tag, so it takes the newest CHANGELOG
          # section, which is what is about to ship.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "'$version' is not a three-part version" >&2; exit 1 ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=Resume-ATS-Friendly-$version" >> "$GITHUB_OUTPUT"
          echo "Building Resume-ATS-Friendly-$version"

      # Refuses to publish a version the changelog does not describe. The same extractor
      # that writes the release body, so the gate cannot pass over a section the body
      # step would then fail to read.
      - name: The changelog describes this version
        run: dev/scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > /dev/null

  release:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the zip and the checksums
        env:
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p out
          git archive --prefix="${NAME}/" --format=zip -o "out/${NAME}.zip" HEAD
          unzip -l "out/${NAME}.zip"
          cp Resume.pdf CoverLetter.pdf out/
          ( cd out && sha256sum ./* > SHA256SUMS )
          cat out/SHA256SUMS

      - name: Build the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          # Runs on every trigger and not only on a tag, so a rehearsal proves the notes
          # extract before the tag exists.
          dev/scripts/changelog-section.sh "$VERSION" > RELEASE_NOTES.md
          printf '\n' >> RELEASE_NOTES.md
          sed -e "1,/^-->$/d" -e "s|@VERSION@|${VERSION}|g" -e "s|@NAME@|${NAME}|g" \
              dev/release-notes-tail.md >> RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || { echo "the release notes came out empty" >&2; exit 1; }
          echo "::group::release body"
          cat RELEASE_NOTES.md
          echo "::endgroup::"

      # A tag can be moved or deleted while this runs, or an old run re-run after it
      # moved. Publishing then would attach a release to a commit this run did not build,
      # or, for a deleted tag, let the release create the tag again somewhere else.
      - name: The tag still names the commit this run built
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # The ^{} line is the commit an annotated tag points to. A lightweight tag has
          # no such line, and points to the commit itself.
          remote="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)"
          [ -n "$remote" ] || remote="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "tag $GITHUB_REF_NAME names ${remote:-nothing} now, not $GITHUB_SHA, the commit this run built" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME still names $GITHUB_SHA"

      # Only a pushed tag publishes. A rehearsal started on a tag stops before this.
      - name: Publish the release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/Resume.pdf
            out/CoverLetter.pdf
            out/${{ needs.version.outputs.name }}.zip
            out/SHA256SUMS
          body_path: RELEASE_NOTES.md
